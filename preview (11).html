<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo pedagógico virtual | Presentación interactiva v32</title>
<style>
:root{
  --brand:#004b2d; --brand2:#006838; --gold:#c79a16; --gold2:#efd889;
  --ink:#10231b; --muted:#4c5f57; --paper:#fbfcf8; --soft:#edf6f1;
  --white:#fff; --line:#c8d8ce; --shadow:0 16px 40px rgba(0,55,30,.13);
  --radius:24px; --fs:1; --fit:1;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 7% 10%,rgba(199,154,22,.18),transparent 25%),
             radial-gradient(circle at 95% 5%,rgba(0,104,56,.14),transparent 28%),
             linear-gradient(135deg,#fffdf1,#f6faf7 52%,#eef6f2);
  font-size:calc(18px * var(--fs) * var(--fit));
}
button{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto 1fr auto auto;gap:.35rem;padding:1rem 1.35rem .75rem;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:50px}
.brand{display:flex;align-items:center;gap:.65rem;color:var(--brand);font-weight:900;letter-spacing:.015em}
.seal{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#d2b12a,#006838 56%,#004b2d);box-shadow:0 6px 18px rgba(0,75,45,.22);flex:0 0 auto}
.controls{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.controls button,.navBtn{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--brand);font-weight:850;border-radius:999px;padding:.45rem .75rem;box-shadow:0 5px 16px rgba(0,0,0,.05);cursor:pointer}
.controls button:hover,.navBtn:hover{background:#fff;transform:translateY(-1px)}
.stage{min-height:0;display:grid;place-items:center;overflow:hidden}
.slide{
  width:min(100%,1480px);height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,0.96fr) minmax(0,1.04fr);
  gap:1.2rem;align-items:stretch;padding:.55rem 0 .35rem;overflow:hidden;
}
.left,.rightCard{min-width:0;min-height:0}
.left{display:grid;grid-template-rows:auto 1fr;align-content:start;gap:.9rem;overflow:hidden}
.kicker{display:inline-flex;align-items:center;gap:.55rem;color:var(--brand2);font-weight:950;text-transform:uppercase;letter-spacing:.08em;font-size:calc(.94rem * var(--fs) * var(--fit))}
.kicker:before{content:"";width:34px;height:4px;background:var(--gold);border-radius:999px}
h1{font-size:clamp(2.05rem,4.2vw,4.6rem);line-height:.98;margin:.45rem 0 .45rem;color:var(--brand);letter-spacing:-.045em}
.lead{font-size:clamp(1.25rem,1.75vw,1.9rem);line-height:1.2;margin:0;max-width:950px;font-weight:650;color:#183429}
.leftPanel{display:grid;grid-template-rows:auto auto 1fr;gap:.65rem;min-height:0;overflow:hidden}
.preview{display:grid;gap:.48rem;margin-top:.15rem}
.preview .point{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:18px;padding:.62rem .78rem;font-size:calc(1.05rem * var(--fs) * var(--fit));line-height:1.25;font-weight:650;box-shadow:0 5px 16px rgba(0,0,0,.035)}
.actionRow{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:.2rem}
.pillBtn{border:0;background:var(--brand);color:#fff;border-radius:999px;padding:.68rem 1rem;font-weight:900;cursor:pointer;box-shadow:0 12px 28px rgba(0,75,45,.18)}
.pillBtn.secondary{background:#fff;color:var(--brand);border:1px solid var(--line)}
.caseNote{align-self:end;background:linear-gradient(135deg,rgba(239,216,137,.35),rgba(255,255,255,.86));border:1px solid rgba(199,154,22,.55);border-radius:22px;padding:.85rem 1rem;font-size:calc(1.05rem * var(--fs) * var(--fit));line-height:1.25;font-weight:650;max-height:22vh;overflow:hidden}
.rightCard{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:1rem;display:grid;grid-template-rows:auto 1fr;gap:.85rem;overflow:hidden}
.visualHead{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-bottom:1px solid #e3ece6;padding-bottom:.65rem}
.visualHead h2{margin:0;color:var(--brand);font-size:calc(1.55rem * var(--fs) * var(--fit));line-height:1.1}
.hint{background:#eef5f1;border:1px solid var(--line);border-radius:999px;padding:.42rem .75rem;font-weight:900;color:var(--muted);font-size:calc(.95rem * var(--fs) * var(--fit));white-space:nowrap}
.visualBody{min-height:0;overflow:hidden;display:grid}
.gridCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;align-content:stretch;min-height:0}
.gridCards.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.gridCards.one{grid-template-columns:1fr}
.cardBtn{
  position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;gap:.55rem;
  border:1px solid var(--line);background:linear-gradient(180deg,#fff,#f8fbf8);border-radius:22px;padding:1rem;cursor:pointer;min-height:135px;overflow:hidden;color:var(--ink)
}
.cardBtn:before{content:"";position:absolute;right:-22px;top:-22px;width:70px;height:70px;border-radius:50%;background:rgba(0,104,56,.08)}
.cardBtn:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,75,45,.13);border-color:rgba(199,154,22,.62)}
.cardBtn h3{margin:0;color:var(--brand);font-size:calc(1.35rem * var(--fs) * var(--fit));line-height:1.08;letter-spacing:-.02em}
.cardBtn .teaser{color:var(--muted);font-size:calc(1rem * var(--fs) * var(--fit));line-height:1.25;font-weight:650;max-width:92%}
.cardBtn .cta{display:inline-flex;margin-top:auto;border-radius:999px;background:#eef5f1;border:1px solid var(--line);color:var(--brand);font-weight:900;padding:.38rem .72rem;font-size:calc(.9rem * var(--fs) * var(--fit))}
.map{position:relative;min-height:100%;border-radius:24px;background:radial-gradient(circle at 50% 48%,#e8f3ed,transparent 39%),linear-gradient(135deg,#fff,#f6fbf8);overflow:hidden}
.map .core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:165px;height:165px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--brand);color:white;font-weight:950;padding:1rem;box-shadow:0 16px 40px rgba(0,75,45,.22)}
.node{position:absolute;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--brand);font-weight:900;padding:.62rem .86rem;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.06);max-width:180px}
.node:hover{background:#f9fff9;border-color:var(--gold)}
.n0{left:8%;top:10%}.n1{right:10%;top:10%}.n2{right:4%;top:44%}.n3{right:12%;bottom:10%}.n4{left:10%;bottom:10%}.n5{left:4%;top:44%}.n6{left:36%;bottom:3%}
.route,.timeline{display:grid;gap:.65rem;align-content:center}
.route{grid-template-columns:repeat(2,minmax(0,1fr))}
.timeline{grid-template-columns:1fr}
.stepBtn{border:1px solid var(--line);border-left:8px solid var(--gold);background:#fff;border-radius:20px;padding:.85rem 1rem;text-align:left;cursor:pointer;min-height:86px}
.stepBtn h3{margin:0;color:var(--brand);font-size:calc(1.28rem * var(--fs) * var(--fit))}
.stepBtn p{margin:.25rem 0 0;color:var(--muted);font-weight:650;font-size:calc(.98rem * var(--fs) * var(--fit))}
.network{position:relative;height:100%;min-height:360px;border-radius:24px;background:linear-gradient(135deg,#fff,#eef7f2);overflow:hidden}
.netNode{position:absolute;border:1px solid var(--line);background:white;color:var(--brand);font-weight:900;border-radius:999px;padding:.65rem .85rem;box-shadow:0 10px 24px rgba(0,0,0,.07);cursor:pointer}
.netNode.center{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--brand);color:white;padding:1.05rem 1.2rem;border-radius:22px}
.soloGrid{display:grid;grid-template-columns:1fr;gap:.45rem;align-content:center}
.soloStep{border:1px solid var(--line);background:#fff;border-radius:18px;padding:.7rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:.8rem;cursor:pointer}
.soloStep b{color:var(--brand);font-size:calc(1.12rem * var(--fs) * var(--fit))}
.badge{background:var(--brand);color:white;border-radius:999px;padding:.22rem .55rem;font-weight:900}
.quiz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;align-content:center}
.quiz button{min-height:84px;border:1px solid var(--line);background:white;border-radius:20px;padding:.9rem;text-align:left;cursor:pointer;font-weight:800;color:var(--brand)}
.quiz .correct{background:#e8f5ee;border-color:#008549}.quiz .wrong{background:#fff1f1;border-color:#c44747}
.casePanel{display:grid;grid-template-rows:auto 1fr auto;gap:.75rem;min-height:0}
.audioBox{border:1px solid var(--line);background:#fff;border-radius:18px;padding:.75rem;display:grid;gap:.5rem}
.audioBox input{font-size:calc(.95rem * var(--fs) * var(--fit))}
.audioBox audio{width:100%;height:38px}
.caseBox{border:1px solid rgba(199,154,22,.52);background:linear-gradient(135deg,#fffaf0,#ffffff);border-radius:22px;padding:1rem;display:grid;align-content:center;min-height:0}
.caseBox h3{margin:0 0 .4rem;color:var(--brand);font-size:calc(1.55rem * var(--fs) * var(--fit))}
.caseBox p{margin:0;font-size:calc(1.2rem * var(--fs) * var(--fit));line-height:1.28;font-weight:650}
.caseControls{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.caseControls button{border:1px solid var(--line);background:white;color:var(--brand);font-weight:900;border-radius:999px;padding:.55rem .8rem;cursor:pointer}
footer{display:grid;grid-template-columns:auto 1fr auto auto;gap:.85rem;align-items:center;min-height:48px}
.progress{height:9px;background:#cfe0d7;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--brand2),var(--gold));width:0}
.count{font-weight:950;color:var(--brand);white-space:nowrap}
.creatorFooter{display:flex;align-items:center;justify-content:center;gap:.55rem;font-size:calc(.76rem * var(--fs));color:#486057;min-height:34px;border-top:1px solid rgba(0,75,45,.12);padding-top:.28rem;text-align:center}
.creatorFooter img{height:30px;width:auto;object-fit:contain} .creatorFooter b{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(10,25,18,.52);display:none;place-items:center;z-index:50;padding:1rem}
.modal.open{display:grid}
.modalBox{width:min(880px,92vw);max-height:84vh;overflow:auto;background:white;border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.26);padding:1.4rem;border:1px solid var(--line)}
.modalBox h2{margin:.1rem 0 .7rem;color:var(--brand);font-size:clamp(1.7rem,3vw,2.6rem)}
.modalBox p,.modalBox li{font-size:1.2rem;line-height:1.38;font-weight:580}
.close{float:right;border:0;background:var(--brand);color:white;border-radius:999px;padding:.45rem .75rem;font-weight:900;cursor:pointer}
.toast{position:fixed;bottom:5.5rem;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:.8rem 1rem;border-radius:999px;box-shadow:var(--shadow);font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1}
body.contrast{background:#fff;color:#000} body.contrast .rightCard,body.contrast .cardBtn,body.contrast .preview .point{border-color:#000}
body.reduce *{transition:none!important;animation:none!important}
@media (max-width:1100px){
  .app{padding:.75rem .85rem .5rem}
  .slide{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:.7rem}
  h1{font-size:clamp(2rem,5.7vw,3.4rem)} .lead{font-size:clamp(1.18rem,2.3vw,1.55rem)}
  .left{gap:.55rem} .preview{grid-template-columns:1fr 1fr} .caseNote{display:none}
  .rightCard{min-height:0} .gridCards.three,.gridCards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cardBtn{min-height:112px;padding:.8rem} .visualHead h2{font-size:1.35rem}
  .creatorFooter{font-size:.68rem} .creatorFooter img{height:24px}
}
@media (max-width:620px){
  header{gap:.5rem;align-items:flex-start} .brand span{font-size:.85rem} .controls button{padding:.35rem .5rem;font-size:.75rem}
  .slide{padding:.2rem 0;gap:.45rem} .preview{grid-template-columns:1fr} .preview .point:nth-child(n+2){display:none}
  .gridCards,.gridCards.three,.route,.quiz{grid-template-columns:1fr}
  .cardBtn{min-height:82px} .cardBtn .teaser{display:none} .cardBtn h3{font-size:1.1rem}
  footer{grid-template-columns:auto 1fr auto;gap:.4rem} footer .count{font-size:.8rem} #next{grid-column:3} .navBtn{font-size:.78rem;padding:.4rem .55rem}
  .creatorFooter{font-size:.58rem;line-height:1.1} .creatorFooter img{height:20px}
}
</style>
</head>
<body>

      <button type="button" id="motion">Reducir movimiento</button>
      <button type="button" id="full">Pantalla completa</button>

<script>
const slides = [{"k": "Inicio · recorrido interactivo", "title": "Modelo pedagógico a distancia y virtual", "lead": "Una lectura del modelo desde una situación problema: la clase virtual de oratoria en un programa técnico.", "bullets": ["Use las flechas o los botones inferiores para avanzar.", "Seleccione los elementos del panel derecho: se abren explicaciones, ejemplos o decisiones.", "El recorrido conserva el orden temático acordado."], "kind": "intro"}, {"k": "Caso inicial", "title": "Un caso para pensar la virtualidad", "lead": "El caso se presenta en una sola escena. Puede escucharse con su audio propio y leerse por fragmentos para no saturar la pantalla.", "bullets": ["Cargue el audio del caso desde su computador.", "Recorra los fragmentos con los botones internos.", "La pregunta guía: ¿la dificultad está en la virtualidad o en el diseño pedagógico?"], "kind": "case"}, {"k": "2 · Modelo Pedagógico", "title": "Modelo Pedagógico", "lead": "Conjunto de lineamientos que da sentido y coherencia a la formación virtual.", "bullets": ["Integra estudiantes, docentes, contenidos, metodologías, recursos y evaluación.", "Regula comunicaciones sincrónicas y asincrónicas.", "Orienta la selección de contenidos y mediaciones digitales."], "note": "La clase de oratoria necesitaba un modelo que organizara la experiencia, no solo más herramientas.", "kind": "map", "center": "Modelo pedagógico", "items": [["Estudiante", "Centro del proceso formativo, con autonomía y responsabilidad."], ["Docente", "Tutor que guía, media y retroalimenta."], ["Contenido", "Saberes pertinentes, contextualizados y actualizados."], ["Recursos", "TIC y materiales al servicio del aprendizaje."], ["Comunicación", "Interacción clara, accesible y permanente."], ["Evaluación", "Proceso progresivo y formativo."]]}, {"k": "3 · Fundamentos", "title": "Fundamentos del Modelo Interestructurante", "lead": "El aprendizaje se entiende como un proceso activo, experiencial y dialógico.", "bullets": ["El estudiante no recibe información de forma pasiva.", "Construye, cuestiona y reconstruye saberes.", "Aprende mediante problemas reales y experiencias significativas."], "note": "La oratoria se aprende hablando, argumentando y recibiendo orientación.", "kind": "route", "items": [["Acción", "El estudiante actúa sobre el conocimiento."], ["Experiencia", "El saber se conecta con situaciones reales."], ["Diálogo", "La comprensión se fortalece al contrastar ideas."], ["Reconstrucción", "El estudiante transforma sus saberes iniciales."], ["Sentido", "Lo aprendido se aplica a su contexto."]]}, {"k": "3.1 · Enfoque Constructivista", "title": "Enfoque Constructivista", "lead": "El estudiante no llega vacío al aula virtual: trae saberes, experiencias, intereses y expectativas.", "bullets": ["El aprendizaje parte de lo que el estudiante ya sabe y vive.", "El docente activa saberes previos y propone retos comprensibles.", "El conocimiento se construye con otros y con recursos del entorno."], "note": "En programación, la expresión oral cobra sentido al presentar soluciones, explicar procesos y dialogar con clientes.", "kind": "tiles", "items": [["¿Qué sabe?", "Reconocer experiencias previas y formas de comunicación."], ["¿Qué necesita?", "Vincular la oratoria con situaciones técnicas reales."], ["¿Qué teme?", "Acompañar inseguridades al hablar en cámara o ante otros."], ["¿Qué produce?", "Convertir la práctica oral en evidencia de aprendizaje."]]}, {"k": "3.2 · Tecnología", "title": "Integración con la Tecnología", "lead": "La tecnología es mediación pedagógica, no simple soporte de diapositivas.", "bullets": ["Amplía interacción, seguimiento y producción de contenidos.", "Facilita colaboración, recursos accesibles y retroalimentación.", "Debe seleccionarse por su valor formativo."], "note": "La plataforma puede servir para grabar, comentar, corregir y mejorar presentaciones orales.", "kind": "dashboard", "items": [["Video", "Grabaciones breves para practicar expresión oral."], ["Foro", "Debate guiado con preguntas que obligan a argumentar."], ["Rúbrica", "Criterios visibles antes de entregar."], ["Comentarios", "Retroalimentación específica y oportuna."], ["Recursos", "Ejemplos de pitch, conferencias y presentaciones técnicas."], ["Seguimiento", "Evidencias de avance entre una práctica y otra."]]}, {"k": "3.3 · Modalidades", "title": "Integración con las Modalidades a Distancia y Virtual", "lead": "La virtualidad ofrece flexibilidad, pero no debe convertirse en aislamiento.", "bullets": ["Adapta estrategias educativas al entorno tecnológico.", "Combina tiempos sincrónicos y asincrónicos.", "Mantiene calidad, acompañamiento y claridad en las orientaciones."], "note": "El estudiante puede conectarse desde celular, trabajo o baja conectividad; el diseño debe preverlo.", "kind": "route", "items": [["Flexibilidad", "Rutas y tiempos compatibles con distintas condiciones."], ["Accesibilidad", "Materiales claros, livianos y disponibles."], ["Acompañamiento", "Orientación docente durante todo el proceso."], ["Calidad", "No basta con subir tareas: se diseña una experiencia."]]}, {"k": "3.5 · Conectivismo", "title": "Conectivismo como Base Teórica", "lead": "Aprender en virtualidad implica conectar personas, fuentes, herramientas y comunidades.", "bullets": ["El conocimiento no está solo en el docente.", "También circula en videos, foros, redes, experiencias y recursos digitales.", "El estudiante aprende a seleccionar, relacionar y usar información."], "note": "Los estudiantes pueden analizar presentaciones reales de proyectos tecnológicos para construir criterios de comunicación oral.", "kind": "network", "center": "Aprendizaje", "items": [["Docente", "Guía y curaduría."], ["Compañeros", "Intercambio y coevaluación."], ["Videos", "Modelos de presentación."], ["Foros", "Discusión argumentada."], ["Recursos", "Lecturas, tutoriales y ejemplos."], ["Contexto", "Problemas reales del campo técnico."]]}, {"k": "Rol docente y estudiante", "title": "Rol o papel del docente y del estudiante", "lead": "En el modelo pedagógico virtual, el aprendizaje se construye desde una relación activa entre quien orienta y quien aprende.", "bullets": ["El docente actúa como tutor, mediador y facilitador del proceso.", "El estudiante asume un papel activo, autónomo, participativo y responsable.", "La interacción entre ambos permite que la virtualidad no sea aislamiento, sino acompañamiento formativo."], "note": "En el caso de oratoria, el docente no debería limitarse a mostrar diapositivas y calificar; debe orientar la práctica comunicativa. El estudiante, por su parte, no solo debe conectarse, sino participar, practicar, preguntar y mejorar.", "kind": "dualrole", "items": [["Docente", "Diseña la experiencia, explica con claridad, propone actividades contextualizadas, acompaña el proceso, promueve participación y ofrece retroalimentación continua."], ["Estudiante", "Gestiona su tiempo, participa activamente, usa recursos digitales, colabora con sus compañeros, practica y asume responsabilidad sobre su aprendizaje."], ["Relación pedagógica", "El aprendizaje se fortalece cuando ambos actores interactúan: el docente media y el estudiante construye, cuestiona, aplica y reconstruye sus saberes."]]}, {"k": "3.6 · Aprendizaje colaborativo", "title": "El Aprendizaje Colaborativo", "lead": "Colaborar no es dividirse tareas: es construir conocimiento con otros.", "bullets": ["Implica diálogo, responsabilidad compartida y producción conjunta.", "Fortalece comunicación, trabajo en equipo y resolución de problemas.", "En virtualidad se apoya en foros, documentos compartidos y encuentros sincrónicos."], "note": "En oratoria, los estudiantes pueden comentar presentaciones, sugerir mejoras y construir criterios comunes.", "kind": "workspace", "items": [["Escuchar", "Atender la presentación del compañero con criterios claros."], ["Comentar", "Dar retroalimentación respetuosa y específica."], ["Ajustar", "Mejorar el discurso a partir de los aportes recibidos."], ["Construir", "Llegar a acuerdos sobre qué hace efectiva una presentación."]]}, {"k": "4 · Elementos clave", "title": "Elementos Clave del Modelo", "lead": "El modelo se organiza mediante preguntas que guían el diseño pedagógico.", "bullets": ["Cada pregunta ayuda a tomar decisiones formativas.", "Evita improvisar actividades sin propósito.", "Conecta estudiante, docente, contenido, recursos y evaluación."], "kind": "questionwheel", "center": "Preguntas guía", "items": [["¿A quién se le enseña?", "Identificar al estudiante real."], ["¿Quién va a enseñar?", "Definir el rol docente."], ["¿Cuál es el propósito?", "Clarificar la intención formativa."], ["¿Qué se enseña?", "Seleccionar contenidos pertinentes."], ["¿Cómo enseñar?", "Diseñar mediaciones y actividades."], ["¿Con qué enseñar?", "Elegir recursos y TIC."], ["¿Qué y hasta dónde aprender?", "Establecer evidencias y niveles de logro."]]}, {"k": "4.1 · Estudiante", "title": "¿A quién se le enseña?", "lead": "Se enseña a estudiantes con condiciones, ritmos, intereses y necesidades diversas.", "bullets": ["Pueden requerir flexibilidad por razones laborales, geográficas, familiares o personales.", "El diseño debe partir del estudiante real, no del estudiante ideal.", "La pertinencia mejora cuando el curso dialoga con su formación y contexto."], "note": "En el caso, son estudiantes técnicos interesados en programación que necesitan ver la utilidad práctica de la expresión oral.", "kind": "scenario", "items": [["Perfil", "Estudiante técnico con expectativa práctica."], ["Necesidad", "Comprender para qué sirve la oratoria en programación."], ["Condición", "Modalidad virtual, posibles restricciones de conectividad y tiempo."]]}, {"k": "4.2 · Docente", "title": "¿Quién va a enseñar?", "lead": "El docente es tutor, mediador y facilitador del aprendizaje.", "bullets": ["Domina contenidos y tecnologías digitales.", "Diseña actividades que promueven autonomía e interacción.", "Acompaña, orienta y retroalimenta el proceso."], "not a ideas y presenta con coherencia."], ["Extendido abstracto", "Aplica la comunicación oral a nuevas situaciones profesionales."]]}, {"k": "Implementación evaluación", "title": "Implementación del Sistema de Evaluación", "lead": "La evaluación debe acompañar el proceso, no aparecer solo al final.", "bullets": ["Incluye evaluaciones en línea.", "Requiere retroalimentación continua.", "Combina evaluaciones colaborativas, formativas y sumativas."], "note": "El estudiante graba una primera presentación, recibe comentarios, ajusta su discurso y entrega una versión final mejorada.", "kind": "timeline", "items": [["Diagnóstico", "Identificar el punto de partida."], ["Práctica", "Realizar una primera evidencia."], ["Retroalimentación", "Recibir orientación específica."], ["Mejora", "Ajustar el desempeño."], ["Cierre", "Demostrar avance en una evidencia final."]]}, {"k": "Equipo de soporte", "title": "Equipo de Trabajo para Soportar el Modelo Pedagógico", "lead": "La virtualidad de calidad no se improvisa; se sostiene institucionalmente.", "bullets": ["Requiere un equipo multidisciplinario.", "Integra diseño, implementación, evaluación, soporte e inclusión.", "Asegura coherencia pedagógica y tecnológica."], "kind": "team", "items": [["Coordinador del programa virtual", "Articula objetivos, planificación y seguimiento."], ["Diseñador instruccional", "Diseña materiales y actividades coherentes."], ["Docente facilitador", "Guía, acompaña y retroalimenta."], ["Tecnólogo educativo", "Integra y mantiene herramientas digitales."], ["Especialista en evaluación", "Apoya criterios, rúbricas y análisis de resultados."], ["Asesor pedagógico", "Fortalece prácticas docentes."], ["Asesor en inclusión", "Garantiza accesibilidad y participación."]]}, {"k": "Cierre", "title": "Del caso al modelo", "lead": "La virtualidad no debe ser distancia pedagógica; debe ser oportunidad para aprender con sentido.", "bullets": ["El caso muestra el riesgo de trasladar una lógica tradicional a la plataforma.", "El modelo propone reconocer al estudiante, contextualizar, interactuar y evaluar formativamente.", "La transformación requiere pedagogía, tecnología, evaluación e institución trabajando juntas."], "kind": "quiz"}];
const caseParts = [{"t": "Contexto del caso", "p": "Estudiantes de un programa técnico ofrecido por la universidad presentan dificultades en el aprendizaje de técnicas de oratoria y expresión oral. Varios no encuentran relación entre esta asignatura y su formación en programación."}, {"t": "Experiencia de clase", "p": "Los estudiantes indican que las clases han sido demasiado teóricas. Al ser virtuales, no ven al docente porque mantiene la cámara apagada y la participación es poco activa."}, {"t": "Actividades y sentido", "p": "También señalan que no comprenden bien el lenguaje usado en clase y que las actividades no les ayudan a entender para qué les sirve la expresión oral si estudian programación."}, {"t": "Dinámica docente", "p": "El docente suele iniciar a la hora indicada, mostrar una diapositiva con la temática, dejar un compromiso y cerrar la clase cuando termina el tiempo."}, {"t": "Evaluación e interacción", "p": "Las actividades son lineales: conceptos y exposiciones grupales virtuales. Al revisar los compromisos, el docente no retroalimenta; solo asigna una nota. Tampoco propicia debate en foros ni actividades participativas."}];
let current=0, caseIndex=0, audioSrc='', fontScale=1;
const stage=document.getElementById('stage'), count=document.getElementById('count'), bar=document.getElementById('bar'), toast=document.getElementById('toast');
function el(tag, cls='', html=''){const x=document.createElement(tag); if(cls) x.className=cls; if(html) x.innerHTML=html; return x;}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function labelFor(s){const m={intro:'Inicio del recorrido',case:'Caso para leer y escuchar',map:'Mapa conceptual',route:'Ruta interactiva',dashboard:'Herramientas del entorno',lab:'Laboratorio virtual',network:'Red de aprendizaje',workspace:'Mesa colaborativa',profiles:'Diversidad del estudiante',questionwheel:'Preguntas guía',scenario:'Perfil del estudiante',rolecards:'Rol docente',target:'Propósito en contexto',cycle:'Ciclo de enseñanza',toolbox:'Caja de recursos',ladder:'Ruta de avance',orbit:'Actores conectados',compare:'Contraste evaluativo',solo:'Escalera SOLO',timeline:'Secuencia evaluativa',team:'Equipo de soporte',quiz:'Actividad final',dualrole:'Docente ↔ Estudiante',tiles:'Exploración'}; return m[s.kind]||'Panel interactivo';}
function teaser(item, i){const bank=['Abra para revisar la idea clave.','Explore la aplicación al caso.','Active una decisión pedagógica.','Revise el sentido formativo.']; return bank[i%bank.length];}
function modalList(items){return '<ul>'+items.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';}
function fullText(s){let h=''; if(s.lead) h+=`<p>${esc(s.lead)}</p>`; if(s.bullets) h+=modalList(s.bullets); if(s.note) h+=`<p><b>Aplicación al caso:</b> ${esc(s.note)}</p>`; return h;}
function showModal(title, body){document.getElementById('modalTitle').textContent=title; document.getElementById('modalBody').innerHTML=Array.isArray(body)?modalList(body):String(body); document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function render(){
  document.documentElement.style.setProperty('--fit','1');
  const s=slides[current]; stage.innerHTML='';
  const slide=el('section','slide');
  const left=el('div','left');
  const head=el('div','head',`<div class="kicker">${esc(s.k)}</div><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead||'')}</p>`);
  const lp=el('div','leftPanel');
  const preview=el('div','preview');
  (s.bullets||[]).slice(0,2).forEach(b=>preview.appendChild(el('div','point',esc(b))));
  const actions=el('div','actionRow');
  actions.appendChild(button('Ver ideas clave',()=>showModal(s.title, fullText(s)),'pillBtn'));
  if((s.items||[]).length) actions.appendChild(button('Ver todos los elementos',()=>showModal(labelFor(s),'<ul>'+s.items.map(it=>`<li><b>${esc(it[0])}:</b> ${esc(it[1])}</li>`).join('')+'</ul>'),'pillBtn secondary'));
  lp.append(preview, actions);
  if(s.note) lp.appendChild(el('div','caseNote',`<b>Aplicación al caso:</b> ${esc(s.note)}`));
  left.append(head,lp);
  const right=el('div','rightCard');
  right.innerHTML=`<div class="visualHead"><h2>${labelFor(s)}</h2><div class="hint">Interactúe aquí</div></div>`;
  const body=el('div','visualBody'); body.appendChild(renderInteraction(s)); right.appendChild(body);
  slide.append(left,right); stage.appendChild(slide);
  count.textContent=`${current+1} / ${slides.length}`; bar.style.width=`${slides.length>1?(current/(slides.length-1))*100:0}%`;
  document.getElementById('prev').disabled=current===0; document.getElementById('next').disabled=current===slides.length-1;
  setTimeout(fitSlide,50);
}
function button(txt, fn, cls=''){const b=el('button',cls,txt); b.type='button'; b.onclick=fn; return b;}
function fitSlide(){
  const slide=stage.querySelector('.slide'); if(!slide) return;
  let fit=1; document.documentElement.style.setProperty('--fit',fit);
  const maxH=stage.clientHeight, maxW=stage.clientWidth;
  for(let i=0;i<12;i++){ if(slide.scrollHeight<=maxH+2 && slide.scrollWidth<=maxW+2) break; fit-=0.03; document.documentElement.style.setProperty('--fit',Math.max(.78,fit)); }
}
function renderInteraction(s){
  if(s.kind==='case') return casePanel();
  if(s.kind==='intro') return introPanel(s);
  if(s.kind==='network') return networkPanel(s);
  if(s.kind==='map'||s.kind==='orbit'||s.kind==='questionwheel') return mapPanel(s);
  if(s.kind==='route'||s.kind==='cycle'||s.kind==='ladder') return routePanel(s);
  if(s.kind==='compare') return comparePanel(s);
  if(s.kind==='solo') return soloPanel(s);
  if(s.kind==='timeline') return timelinePanel(s);
  if(s.kind==='quiz') return quizPanel();
  return cardsPanel(s);
}
function introPanel(s){const d=el('div','gridCards'); [['Propósito','Comprender el modelo como guía para diseñar experiencias virtuales con sentido formativo.'],['Ruta','Del caso problema a los fundamentos, elementos, roles, evaluación y soporte institucional.'],['Interacción','Cada panel abre una explicación o decisión pedagógica sin saturar la pantalla.'],['CINTIA','Recurso creado para apoyar la docencia con mediación tecnológica.']].forEach((it,i)=>d.appendChild(card(it[0],it[1],i))); return d;}
function card(t,detail,i=0){const b=el('button','cardBtn',`<h3>${esc(t)}</h3><div class="teaser">${teaser(null,i)}</div><span class="cta">Abrir detalle →</span>`); b.type='button'; b.onclick=()=>showModal(t,`<p>${esc(detail)}</p>`); return b;}
function cardsPanel(s){const items=(s.items&&s.items.length?s.items:[['Ideas clave',(s.bullets||[]).join(' ')],['Aplicación al caso',s.note||s.lead||'']]); const d=el('div','gridCards '+(items.length<=3?'three':'')); items.forEach((it,i)=>d.appendChild(card(it[0],it[1],i))); return d;}
function routePanel(s){const d=el('div','route'); (s.items||[]).forEach((it,i)=>{const b=el('button','stepBtn',`<h3>${esc(it[0])}</h3><p>${teaser(it,i)}</p>`); b.type='button'; b.onclick=()=>showModal(it[0],`<p>${esc(it[1])}</p>`); d.appendChild(b);}); return d;}
function timelinePanel(s){const d=el('div','timeline'); (s.items||[]).forEach((it,i)=>{const b=el('button','stepBtn',`<h3>${esc(it[0])}</h3><p>Momento ${i+1}: abrir explicación.</p>`); b.type='button'; b.onclick=()=>showModal(it[0],`<p>${esc(it[1])}</p>`); d.appendChild(b);}); return d;}
function mapPanel(s){const w=el('div','map'); w.appendChild(el('div','core',esc(s.center||s.title))); (s.items||[]).slice(0,7).forEach((it,i)=>{const n=el('button',`node n${i}`,esc(it[0])); n.type='button'; n.onclick=()=>showModal(it[0],`<p>${esc(it[1])}</p>`); w.appendChild(n);}); return w;}
function networkPanel(s){const w=el('div','network'); const center=el('button','netNode center',esc(s.center||'Aprendizaje')); center.type='button'; center.onclick=()=>showModal(s.center||'Aprendizaje','<p>El aprendizaje se fortalece cuando el estudiante conecta personas, recursos, experiencias y herramientas.</p>'); w.appendChild(center); const pos=[[7,9],[56,7],[72,35],[57,72],[12,70],[4,37]]; (s.items||[]).slice(0,6).forEach((it,i)=>{const b=el('button','netNode',esc(it[0])); b.style.left=pos[i][0]+'%'; b.style.top=pos[i][1]+'%'; b.type='button'; b.onclick=()=>showModal(it[0],`<p>${esc(it[1])}</p>`); w.appendChild(b);}); return w;}
function comparePanel(s){const d=el('div','gridCards'); (s.items||[]).forEach((it,i)=>d.appendChild(card(it[0],it[1],i))); return d;}
function soloPanel(s){const d=el('div','soloGrid'); (s.items||[]).forEach((it,i)=>{const b=el('button','soloStep',`<b>${esc(it[0])}</b><span class="badge">${i+1}</span>`); b.type='button'; b.onclick=()=>showModal(it[0],`<p>${esc(it[1])}</p>`); d.appendChild(b);}); return d;}
function casePanel(){
  const c=caseParts[caseIndex]; const wrap=el('div','casePanel');
  const audio=el('div','audioBox',`<label><b>Audio del caso:</b> cargue su archivo local</label><input id="audioFile" type="file" accept="audio/*"><audio id="audio" controls></audio>`);
  const box=el('div','caseBox',`<h3>${esc(c.t)}</h3><p>${esc(c.p)}</p>`);
  const ctr=el('div','caseControls',`<button id="cprev">← Fragmento</button><strong>${caseIndex+1} / ${caseParts.length}</strong><button id="cnext">Fragmento →</button>`);
  wrap.append(audio,box,ctr);
  setTimeout(()=>{const au=document.getElementById('audio'); if(audioSrc) au.src=audioSrc; document.getElementById('audioFile').onchange=e=>{const f=e.target.files[0]; if(f){audioSrc=URL.createObjectURL(f); au.src=audioSrc; au.play().catch(()=>{});}}; document.getElementById('cprev').onclick=()=>{caseIndex=(caseIndex+caseParts.length-1)%caseParts.length; render();}; document.getElementById('cnext').onclick=()=>{caseIndex=(caseIndex+1)%caseParts.length; render();};},0);
  return wrap;
}
function quizPanel(){const q=el('div','quiz'); [['A','La forma de enseñar'],['B','La forma de evaluar'],['C','El uso de la tecnología'],['D','El acompañamiento institucional'],['E','Todas las anteriores']].forEach(o=>{const b=el('button','',`<b>${o[0]}.</b> ${o[1]}`); b.type='button'; b.onclick=()=>{if(o[0]==='E'){b.classList.add('correct'); notify('Correcto: el modelo transforma la experiencia completa de aprendizaje.')}else{b.classList.add('wrong'); notify('Es una parte del cambio, pero no basta por sí sola.')}}; q.appendChild(b);}); return q;}
function notify(msg){toast.textContent=msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),3300);}
function go(d){current=Math.max(0,Math.min(slides.length-1,current+d)); render();}
document.getElementById('prev').onclick=()=>go(-1); document.getElementById('next').onclick=()=>go(1);
document.getElementById('increase').onclick=()=>{fontScale=Math.min(1.22,fontScale+.06);document.documentElement.style.setProperty('--fs',fontScale);fitSlide();};
document.getElementById('decrease').onclick=()=>{fontScale=Math.max(.88,fontScale-.06);document.documentElement.style.setProperty('--fs',fontScale);fitSlide();};
document.getElementById('contrast').onclick=()=>document.body.classList.toggle('contrast');
document.getElementById('motion').onclick=()=>document.body.classList.toggle('reduce');
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();};
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='Escape')closeModal();});
window.addEventListener('resize',fitSlide); render();
</script>
